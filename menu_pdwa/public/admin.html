<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Menú Digital</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f9; padding: 20px; max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hidden { display: none; }
    input, button, select { display: block; width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>

  <!-- FORMULARIO DE LOGIN -->
  <div id="login-section" class="card">
    <h2>Iniciar Sesión (Admin)</h2>
    <form id="login-form">
      <input type="text" id="username" placeholder="Usuario" required value="admin">
      <input type="password" id="password" placeholder="Contraseña" required value="admin123">
      <button type="submit">Ingresar</button>
    </form>
    <p id="login-error" style="color: red;" class="hidden"></p>
  </div>

  <!-- PANEL DE GESTIÓN (OCULTO HASTA AUTENTICAR) -->
  <div id="admin-panel" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Gestión de Productos y Promociones</h2>
      <button id="logout-btn" class="btn-danger" style="width: auto;">Cerrar Sesión</button>
    </div>

    <form id="product-form" class="card" style="box-shadow: none; padding: 0;">
      <input type="hidden" id="prod-id">
      <label for="prod-category">Categoría</label>
      <select id="prod-category" required></select>
      <label for="prod-name">Nombre</label>
      <input type="text" id="prod-name" required>
      <label for="prod-price">Precio final ($)</label>
      <input type="number" id="prod-price" min="0" step="0.01" required>
      <label for="prod-description">Descripción</label>
      <textarea id="prod-description" rows="3" style="width: 100%; margin-top: 10px; box-sizing: border-box;"></textarea>
      <label for="prod-customization">Tipo de personalización</label>
      <select id="prod-customization">
        <option value="simple">Producto simple</option>
        <option value="icecream">Helado: sabores y toppings</option>
        <option value="pizza">Pizza: tamaño y adicionales</option>
        <option value="promo_pizza">Promo de pizzas: adicionales gratis</option>
      </select>
      <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="prod-free-extras" style="width: auto; margin: 0;">
        Incluir un adicional gratis por pizza
      </label>
      <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="prod-available" checked style="width: auto; margin: 0;">
        Disponible para la venta
      </label>
      <div style="display: flex; gap: 8px;">
        <button type="submit">Guardar producto</button>
        <button type="button" id="cancel-edit-btn" class="btn-danger hidden">Cancelar</button>
      </div>
    </form>

    <!-- TABLA DE PRODUCTOS -->
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio ($)</th>
          <th>Personalización</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="products-list"></tbody>
    </table>

    <section class="card" style="margin-top: 24px; box-shadow: none; border: 1px solid #ddd;">
      <h2>Extras, toppings y sabores</h2>
      <form id="extra-form">
        <input type="hidden" id="extra-id">
        <label for="extra-type">Tipo</label>
        <select id="extra-type" required>
          <option value="pizza">Extra para pizza</option>
          <option value="burger">Extra para hamburguesa</option>
          <option value="icecream_flavor">Sabor de helado</option>
          <option value="icecream_topping">Topping de helado</option>
        </select>
        <label for="extra-name">Nombre</label>
        <input type="text" id="extra-name" required placeholder="Ej: Champiñones, Pistacho, Tocineta">
        <label for="extra-price">Precio adicional ($)</label>
        <input type="number" id="extra-price" min="0" step="0.01" value="0">
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
          <input type="checkbox" id="extra-included" style="width: auto; margin: 0;">
          Ingrediente incluido (vegetal de hamburguesa o sabor de helado)
        </label>
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
          <input type="checkbox" id="extra-available" checked style="width: auto; margin: 0;">
          Disponible para el cliente
        </label>
        <div style="display: flex; gap: 8px;">
          <button type="submit">Guardar extra</button>
          <button type="button" id="cancel-extra-btn" class="btn-danger hidden">Cancelar</button>
        </div>
      </form>

      <table>
        <thead>
          <tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Estado</th><th>Acción</th></tr>
        </thead>
        <tbody id="extras-list"></tbody>
      </table>
    </section>
  </div>

  <!-- En admin.html -->
<script type="module" src="js/admin.js"></script>
</body>
</html>
