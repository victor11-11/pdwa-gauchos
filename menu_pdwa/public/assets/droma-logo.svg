<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">D'Roma Ristorante &amp; Terraza</title>
  <desc id="desc">Logo de D'Roma sobre mármol blanco</desc>
  <defs>
    <filter id="marble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f0f0ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#stone)"/>
  <g opacity=".18" fill="none" stroke="#899096" stroke-linecap="round" filter="url(#marble)">
    <path stroke-width="4" d="M-30 96C98 36 122 154 256 98S406 55 548 8"/>
