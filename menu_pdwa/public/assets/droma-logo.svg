    <path stroke-width="2" d="M-20 398c100-45 130 8 215-28s126-104 205-66 84 7 132-23"/>
    <path stroke-width="2" d="M66-20c30 90 104 90 122 185s-25 144 62 235 84 76 118 133"/>
  </g>
  <g text-anchor="middle" fill="#050505">
    <text x="256" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="106" font-weight="700" letter-spacing="-7">D'ROMA</text>
    <circle cx="188" cy="145" r="9" fill="#16a05d"/>
    <path d="M72 270H206M306 270H440" stroke="#a52c39" stroke-width="3"/>
    <text x="256" y="293" font-family="Arial, sans-serif" font-size="18" letter-spacing="6">RISTORANTE</text>
    <text x="256" y="322" font-family="Arial, sans-serif" font-size="17" letter-spacing="4">&amp; TERRAZA</text>
    <path d="M244 353h15v48l-15-10z" fill="#169d5c"/>
    <path d="M262 353h15v38l-15 10z" fill="#d8293d"/>
