<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital &amp; Pedidos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Menú Digital</h1>
  </header>

  <main id="app">
    <nav id="category-nav" class="category-nav" aria-label="Categorías del menú"></nav>
    <section id="product-list" class="product-list" aria-live="polite"></section>
  </main>

  <button id="cart-fab" class="cart-fab hidden" style="position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: #e53e3e; color: white; border: none; box-shadow: 0 4px 14px rgba(229, 62, 62, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 90; transition: transform 0.2s;">
    🛒
    <span id="cart-badge" style="position: absolute; top: -4px; right: -4px; background: #222; color: white; font-size: 0.75rem; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white;">0</span>
  </button>

  <div id="pizza-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50;">
    <div style="background: white; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%;">
      <h2 id="modal-title" style="margin-top: 0; font-size: 1.25rem; font-weight: bold;"></h2>
      <p id="modal-desc" style="color: #666; font-size: 0.9rem; margin-bottom: 16px;"></p>
      <div style="margin-bottom: 16px;"><h4 style="margin-bottom: 8px; font-weight: 600;">Opciones / Incluidos:</h4><div id="modal-sizes"></div></div>
      <div style="margin-bottom: 16px;"><h4 style="margin-bottom: 8px; font-weight: 600;">Adicionales o acompañantes:</h4><div id="modal-toppings"></div></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 12px;">
        <span style="font-size: 1.1rem; font-weight: bold;">Total: <span id="modal-total">$0.00</span></span>
        <div><button id="btn-close-pizza-modal" style="background: #e5e7eb; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-right: 8px;">Cancelar</button><button id="btn-add-pizza-cart" style="background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Agregar</button></div>
      </div>
    </div>
  </div>

  <div id="cart-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: flex-end;">
    <div style="background: white; width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.1); box-sizing: border-box;">
      <div style="padding: 18px 20px; background: #1a202c; color: white; display: flex; justify-content: space-between; align-items: center;"><div><h2 style="margin: 0; font-size: 1.15rem; font-weight: bold;">Comanda / Pedido</h2><small style="color: #a0aec0;" id="pos-items-count">0 productos seleccionados</small></div><button id="btn-close-cart-modal" style="background: none; border: none; font-size: 1.8rem; color: white; cursor: pointer; line-height: 1;">&times;</button></div>
      <div id="cart-items-container" style="flex: 1; padding: 16px 20px; overflow-y: auto; background: #f8fafc;"></div>
      <div style="padding: 16px 20px; background: white; border-top: 1px solid #e2e8f0; box-shadow: 0 -4px 10px rgba(0,0,0,0.03);">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;"><div><label style="display: block; font-weight: 600; font-size: 0.8rem; color: #4a5568; margin-bottom: 4px;">Mesa / Ubicación:</label><input type="text" id="order-table" placeholder="Ej: Mesa 2" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;"></div><div><label style="display: block; font-weight: 600; font-size: 0.8rem; color: #4a5568; margin-bottom: 4px;">Tipo de Orden:</label><select id="order-type" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem; background: white;"><option value="Comer Aquí">Comer Aquí</option><option value="Para Llevar">Para Llevar</option><option value="Delivery">Delivery</option></select></div></div>
        <div style="margin-bottom: 12px;"><input type="text" id="order-notes" placeholder="Notas (Ej: Sin cebolla, extra salsa...)" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-top: 8px; border-top: 1px dashed #e2e8f0;"><span style="font-size: 1rem; color: #718096; font-weight: 600;">Total General</span><strong id="cart-modal-total" style="font-size: 1.4rem; color: #e53e3e;">$0.00</strong></div>
        <button id="btn-send-whatsapp" style="width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3);">📲 Confirmar &amp; Enviar Comanda</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
