<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital & Pedidos</title>
  
  <!-- Evita el error 404 del favicon en consola -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Menú Digital</h1>
  </header>

  <main id="app">
    <!-- Navegación por Categorías -->
    <nav id="category-nav" class="category-nav"></nav>

    <!-- Contenedor de Productos -->
    <section id="product-list" class="product-list"></section>
  </main>

  <!-- Botón Flotante del Carrito -->
  <div id="cart-bar" class="cart-bar hidden">
    <span id="cart-count">0 items</span>
    <button id="checkout-btn">Ver Pedido (<span id="cart-total">$0.00</span>)</button>
  </div>

  <!-- Modal de Personalización de Pizza -->
  <div id="pizza-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50;">
    <div style="background: white; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%;">
      <h2 id="modal-title" style="margin-top: 0; font-size: 1.25rem; font-weight: bold;"></h2>
      <p id="modal-desc" style="color: #666; font-size: 0.9rem; margin-bottom: 16px;"></p>

      <div style="margin-bottom: 16px;">
        <h4 style="margin-bottom: 8px; font-weight: 600;">Tamaño:</h4>
        <div id="modal-sizes"></div>
      </div>

      <div style="margin-bottom: 16px;">
        <h4 style="margin-bottom: 8px; font-weight: 600;">Adicionales:</h4>
        <div id="modal-toppings"></div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 12px;">
        <span style="font-size: 1.1rem; font-weight: bold;">Total: <span id="modal-total">$0.00</span></span>
        <div>
          <button id="btn-close-pizza-modal" style="background: #e5e7eb; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-right: 8px;">Cancelar</button>
          <button id="btn-add-pizza-cart" style="background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Carga de módulos ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
